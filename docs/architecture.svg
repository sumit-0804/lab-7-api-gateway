<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 730" width="960" height="730" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="960" height="730" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Lab 7 - API Gateway, Service Discovery &amp; Cloud</text>

  <!-- Client -->
  <rect x="360" y="56" width="240" height="54" rx="8" fill="#f1f5f9" stroke="#334155"/>
  <text x="480" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">Client / Postman</text>
  <text x="480" y="99" text-anchor="middle" font-size="12" fill="#475569">Internet - one public address</text>

  <line x1="480" y1="110" x2="480" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="490" y="140" font-size="12" fill="#475569">HTTPS (cloud) / :8080 (local) - the only public port</text>

  <!-- Gateway -->
  <rect x="250" y="162" width="440" height="112" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="480" y="188" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">API Gateway (api-gateway)</text>
  <text x="480" y="210" text-anchor="middle" font-size="12" fill="#1e3a8a">/users/* -&gt; User   /products/* -&gt; Product   /orders/* -&gt; Order</text>
  <text x="480" y="230" text-anchor="middle" font-size="12" fill="#1e3a8a">GET /health (own)   GET /health/services</text>
  <text x="480" y="250" text-anchor="middle" font-size="12" fill="#1e3a8a">request logging  |  503 unreachable / 502 bad response</text>
  <text x="480" y="266" text-anchor="middle" font-size="11" fill="#475569">no business logic</text>

  <!-- Registry -->
  <rect x="730" y="162" width="204" height="112" rx="8" fill="#fef9c3" stroke="#a16207"/>
  <text x="832" y="186" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Service registry</text>
  <text x="832" y="204" text-anchor="middle" font-size="11" fill="#713f12">.env / cloud env vars</text>
  <text x="832" y="226" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#713f12">USER_SERVICE_URL</text>
  <text x="832" y="243" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#713f12">PRODUCT_SERVICE_URL</text>
  <text x="832" y="260" text-anchor="middle" font-size="11" font-family="Consolas, monospace" fill="#713f12">ORDER_SERVICE_URL</text>
  <line x1="730" y1="218" x2="692" y2="218" stroke="#a16207" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="832" y="292" text-anchor="middle" font-size="11" fill="#a16207">read at startup -&gt; routing table</text>

  <!-- Network boundary -->
  <rect x="40" y="316" width="880" height="200" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="58" y="340" font-size="13" font-weight="700" fill="#334155">campus-network</text>
  <text x="58" y="357" font-size="11" fill="#334155">not reachable from outside</text>

  <!-- Services -->
  <rect x="80" y="380" width="220" height="90" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="190" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">User Service</text>
  <text x="190" y="430" text-anchor="middle" font-size="12" fill="#14532d">:3001  /users</text>
  <text x="190" y="450" text-anchor="middle" font-size="11" fill="#475569">owns user data</text>

  <rect x="370" y="380" width="220" height="90" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="480" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Product Service</text>
  <text x="480" y="430" text-anchor="middle" font-size="12" fill="#14532d">:3002  /products</text>
  <text x="480" y="450" text-anchor="middle" font-size="11" fill="#475569">owns catalogue + stock</text>

  <rect x="660" y="380" width="220" height="90" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="770" y="410" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">Order Service</text>
  <text x="770" y="430" text-anchor="middle" font-size="12" fill="#14532d">:3003  /orders</text>
  <text x="770" y="450" text-anchor="middle" font-size="11" fill="#15803d">owns orders; calls User + Product</text>

  <!-- Gateway -> services -->
  <line x1="380" y1="274" x2="210" y2="378" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="274" x2="480" y2="378" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="274" x2="750" y2="378" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Order -> User / Product -->
  <line x1="660" y1="440" x2="592" y2="440" stroke="#15803d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <path d="M 700 470 C 700 498, 260 498, 230 472" fill="none" stroke="#15803d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  
  <!-- Atlas -->
  <line x1="190" y1="470" x2="190" y2="608" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="470" x2="480" y2="608" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="470" x2="770" y2="608" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="120" y="610" width="720" height="92" rx="10" fill="#ecfdf5" stroke="#047857" stroke-width="2"/>
  <text x="480" y="636" text-anchor="middle" font-size="15" font-weight="700" fill="#064e3b">MongoDB Atlas (cloud) - one cluster</text>
  <rect x="250" y="650" width="140" height="36" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="320" y="673" text-anchor="middle" font-size="12" fill="#064e3b">userdb</text>
  <rect x="410" y="650" width="140" height="36" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="480" y="673" text-anchor="middle" font-size="12" fill="#064e3b">productdb</text>
  <rect x="570" y="650" width="140" height="36" rx="6" fill="#ffffff" stroke="#047857"/>
  <text x="640" y="673" text-anchor="middle" font-size="12" fill="#064e3b">orderdb</text>
  <text x="480" y="720" text-anchor="middle" font-size="11" fill="#475569">each service connects with its own MONGO_URI (database per service)</text>
</svg>
